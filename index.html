<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Shivya — Solving all diseases</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      color-scheme: light dark;
      --ground: #e8ece8;
      --ink: #08110e;
      --quiet: rgba(8, 17, 14, .28);
      --accent: #f1693f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #050a08;
        --ink: #f1f5f1;
        --quiet: rgba(241, 245, 241, .25);
        --accent: #f48460;
      }
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--ground);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    .aperture {
      position: absolute;
      z-index: 0;
      inset: 0;
      margin: 0;
      background: #081310;
      overflow: hidden;
    }

    .aperture::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2, 8, 6, .72) 0%, rgba(2, 8, 6, .26) 38%, rgba(2, 8, 6, .08) 72%, rgba(2, 8, 6, .38) 100%),
        linear-gradient(180deg, rgba(2, 8, 6, .18), transparent 45%, rgba(2, 8, 6, .44));
      pointer-events: none;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 50%;
      filter: saturate(.76) contrast(1.1) brightness(.78);
    }

    .statement {
      position: relative;
      z-index: 2;
      width: 100%;
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: clamp(32px, 6.8vw, 108px);
      color: #f4f7f3;
      pointer-events: none;
    }

    h1 {
      max-width: 1050px;
      margin: 0;
      font-size: clamp(5.1rem, 11.4vw, 12rem);
      font-weight: 300;
      line-height: .78;
      letter-spacing: -.09em;
      text-wrap: balance;
      text-shadow: 0 3px 36px rgba(0, 0, 0, .28);
    }

    h1 span { display: block; }
    h1 .all {
      width: max-content;
      margin-left: .78em;
      color: var(--accent);
      font-weight: 400;
    }
    h1 .diseases { margin-left: .06em; }

    .orbital {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      right: clamp(26px, 4vw, 64px);
      width: 1px;
      background: rgba(255, 255, 255, .26);
      pointer-events: none;
    }

    .orbital::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 16%;
      width: 9px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(6, 14, 11, .26);
    }

    @media (max-width: 760px) {
      .aperture::after {
        background:
          linear-gradient(180deg, rgba(2, 8, 6, .09) 0%, rgba(2, 8, 6, .12) 39%, rgba(2, 8, 6, .76) 100%),
          linear-gradient(90deg, rgba(2, 8, 6, .24), transparent 72%);
      }
      video { object-position: 50% 50%; }
      .statement {
        align-items: flex-end;
        padding: 0 22px max(38px, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: clamp(4.5rem, 22.8vw, 7rem);
        line-height: .81;
        letter-spacing: -.085em;
      }
      h1 .all { margin-left: .43em; }
      h1 .diseases { margin-left: 0; }
      .orbital { right: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      video { filter: saturate(.68) contrast(1.07) brightness(.78); }
    }
  </style>
</head>
